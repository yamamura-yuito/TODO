<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TODOリスト</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>TODOリスト</h1>

    <form th:action="@{/todos}" th:method="post">
        <input type="text" name="title" placeholder="新しいTODOを入力" required/>
        <button type="submit">追加</button>
    </form>

    <div th:if="${todos == null || todos.isEmpty()}">
        <p class="empty-message">TODOアイテムはまだありません。上から追加してください！</p>
    </div>

    <ul th:if="${todos != null && !todos.isEmpty()}">
        <li th:each="todo : ${todos}">
            <input type="checkbox" th:checked="${todo.completed}"
                   th:onclick="'window.location.href=\'' + @{/todos/{id}/toggle(id=${todo.id})} + '\''" />
            <span th:text="${todo.title}" class="todo-title" th:classappend="${todo.completed} ? 'completed' : ''">Todo Title</span>
            <div class="actions">
                <a th:href="@{/todos/{id}/toggle(id=${todo.id})}">状態切替</a>
                <a th:href="@{/todos/{id}/delete(id=${todo.id})}" class="delete">削除</a>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
