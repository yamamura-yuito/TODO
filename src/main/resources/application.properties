# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/todo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=JST
spring.datasource.username=todo_user
spring.datasource.password=password
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect # MySQL 8以降の場合
# spring.jpa.database-platform=org.hibernate.dialect.MySQL57Dialect # MySQL 5.7の場合

spring.jpa.hibernate.ddl-auto=update # 開発中は update や validate を使用。本番では none や flyway/liquibase を推奨
spring.jpa.show-sql=true # SQLログの表示 (任意)

# Allow Thymeleaf templates to be reloaded without restarting the application
spring.thymeleaf.cache=false
